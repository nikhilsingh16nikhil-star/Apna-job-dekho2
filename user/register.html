<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Create Account | Apna Job Dekho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
      <meta name="theme-color" content="#916973" />
    <link rel="stylesheet" href="../mobile.css" />
  </head>
  <body>
    <header class="site-header"><div class="container d-flex align-items-center justify-content-center py-3"><a href="../index.html" class="brand"><img class="brand-logo" src="https://github.com/nikhilsingh16nikhil-star/Apna-job-dekho/blob/main/WhatsApp%20Image%202026-10-23%20at%205.01.48%20PM.jpeg?raw=true" alt="Apna Job Dekho" /></a></div></header>
    <div class="auth-shell">
      <div class="auth-card">
        <h2>Create your account</h2>
        <p class="subtext">Start building your future with a profile designed for students and freshers.</p>
        <form id="register-form">
          <div class="row g-2">
            <div class="col-12 col-md-4">
              <div class="field-group">
                <label for="firstName">First name <span class="text-danger">(required)</span></label>
                <input type="text" id="firstName" name="firstName" class="form-control" placeholder="First name" autocomplete="given-name" required />
              </div>
            </div>
            <footer class="site-footer"><div class="container d-flex justify-content-center"><a href="../index.html" class="brand footer-brand"><img class="brand-logo" src="https://github.com/nikhilsingh16nikhil-star/Apna-job-dekho/blob/main/WhatsApp%20Image%202026-10-23%20at%205.01.48%20PM.jpeg?raw=true" alt="Apna Job Dekho" /></a></div></footer>
            <div class="col-12 col-md-4">
              <div class="field-group">
                <label for="middleName">Middle name <span class="text-muted">(optional)</span></label>
                <input type="text" id="middleName" name="middleName" class="form-control" placeholder="Middle name" autocomplete="additional-name" />
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="field-group">
                <label for="lastName">Last name <span class="text-danger">(required)</span></label>
                <input type="text" id="lastName" name="lastName" class="form-control" placeholder="Last name" autocomplete="family-name" required />
              </div>
            </div>
          </div>
          <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" />
          </div>
          <div class="field-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <div class="mt-3 text-center">
          <a href="login.html" class="inline-link">Already registered? Login</a>
        </div>
      </div>
    </div>
    <script src="../app.js"></script>
      <script src="../mobile.js"></script>
  </body>
</html>
